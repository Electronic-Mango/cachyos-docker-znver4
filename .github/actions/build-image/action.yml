name: Build and publish an image
description: Build a Docker image, publish it to GHCR, and attest it

inputs:
  variant:
    description: Image name suffix
    required: true
  dockerfile:
    description: Dockerfile path relative to the repository root
    required: true

runs:
  using: composite
  steps:
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ghcr.io/${{ github.repository }}/${{ inputs.variant }}
        tags: |
          type=raw,value=latest
    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Generate artifact attestation
      uses: actions/attest@v4
      with:
        subject-name: ghcr.io/${{ github.repository }}/${{ inputs.variant }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true
