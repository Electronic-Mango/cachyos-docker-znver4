name: Build and publish an image

on:
  workflow_call:
    inputs:
      variant:
        description: Image name suffix
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: true
        type: string
    outputs:
      published:
        description: Whether the image was built, pushed, and attested
        value: ${{ jobs.build.outputs.published }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/${{ inputs.variant }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.attest.outcome == 'success' && steps.push.outcome == 'success' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Show runner CPU capabilities
        run: lscpu
      - name: Check runner CPU compatibility
        id: cpu
        shell: bash
        run: |
          cpu_info=$(LC_ALL=C lscpu)
          if grep -qw avx512f <<< "$cpu_info"; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping image build: runner does not expose avx512f."
            echo "Image build skipped: runner does not expose avx512f." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout repository
        if: steps.cpu.outputs.supported == 'true'
        uses: actions/checkout@v6
      - name: Log in to the Container registry
        if: steps.cpu.outputs.supported == 'true'
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        if: steps.cpu.outputs.supported == 'true'
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
      - name: Build and push Docker image
        if: steps.cpu.outputs.supported == 'true'
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        if: steps.cpu.outputs.supported == 'true'
        id: attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
