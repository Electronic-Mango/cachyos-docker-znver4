name: Create and publish Docker images

on:
  workflow_dispatch:
  schedule:
    - cron: '41 15 * * *'
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-base:
    uses: ./.github/workflows/build-image.yml
    with:
      variant: base
      dockerfile: ./Dockerfile

  build-distrobox:
    needs: build-base
    if: needs.build-base.outputs.published == 'true'
    uses: ./.github/workflows/build-image.yml
    with:
      variant: distrobox
      dockerfile: ./Dockerfile-distrobox
